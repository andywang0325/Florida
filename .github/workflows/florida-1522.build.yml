name: build-frida-1522-ggbond-arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 15.2.2 的 releng/setup-env.sh 里 ndk_required=24，版本不对会直接拒绝构建
      - name: Setup Android NDK r24
        id: setup-ndk
        uses: nttld/setup-ndk@v1.0.6
        with:
          ndk-version: r24

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build bison flex xz-utils bzip2 \
            python3-dev python3-pip python3-setuptools curl

      # 15.x 的子模块在【顶层】：frida/frida-core、frida/frida-gum、frida/releng/meson
      # （16+ 才挪到 subprojects/ 下）。必须全量 init：顶层 Makefile 里的
      # git-submodule-stamps 会对 frida-python / frida-node / frida-tools 逐个跑
      # `cd <dir> && git log`，缺一个目录 make 就报错。
      - name: Clone frida 15.2.2
        run: |
          git config --global user.name  "builder"
          git config --global user.email "builder@example.com"
          git clone -b 15.2.2 https://github.com/frida/frida frida
          cd frida
          git submodule update --init --recursive
          echo "=== 布局校验（15.x：顶层） ==="
          ls -l frida-core/meson.build frida-gum/meson.build releng/meson/meson.py Makefile.linux.mk
          echo "=== 子模块版本 ==="
          git submodule status | head -20

      - name: Apply anti-detection patches
        run: |
          python3 tools/port_patches_to_1522.py frida
          echo
          echo "=== 复查：参与 Android 构建的文件里不应再有这些特征 ==="
          cd frida/frida-core
          for k in "frida:rpc" "re.frida.server" "frida_agent_main" "frida-agent-arm64.so"; do
            echo "$k -> $(grep -rl "$k" src/linux lib/agent lib/base server 2>/dev/null | wc -l) 个文件"
          done
          cd ../frida-gum
          echo "gum-js-loop -> $(grep -rl 'gum-js-loop' bindings gum 2>/dev/null | wc -l) 个文件"

      # 15.x 没有 configure 脚本（那是 16/17 才有），构建入口是 make core-android-arm64
      - name: Build frida-server for android-arm64
        run: |
          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          cd frida
          make core-android-arm64 FRIDA_V8=disabled

      - name: Collect artifact
        run: |
          mkdir -p out
          target=out/frida-server-15.2.2-ggbond-android-arm64
          if [ -f frida/build/frida-android-arm64/bin/frida-server ]; then
            cp frida/build/frida-android-arm64/bin/frida-server "$target"
          else
            find frida/build -type f -name 'frida-server' -print | head -5
            find frida/build -type f -name 'frida-server' -print -quit | while read -r f; do cp "$f" "$target"; done
          fi
          chmod +x "$target" 2>/dev/null || true
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-15.2.2-ggbond-android-arm64
          path: out/frida-server-15.2.2-ggbond-android-arm64
          if-no-files-found: error
