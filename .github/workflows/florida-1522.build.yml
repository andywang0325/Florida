name: build-frida-1522-ggbond-arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Setup Android NDK r25b
        id: setup-ndk
        uses: nttld/setup-ndk@v1.0.6
        with:
          ndk-version: r25b

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential tree ninja-build gcc-multilib g++-multilib \
            lib32stdc++-9-dev flex bison ruby ruby-dev \
            python3-requests python3-setuptools python3-dev python3-pip \
            libc6-dev libc6-dev-i386
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief graphlib

      - name: Clone frida 15.2.2
        run: |
          git config --global user.name  "builder"
          git config --global user.email "builder@example.com"
          git clone --recurse-submodules -b 15.2.2 https://github.com/frida/frida frida
          cd frida
          git submodule update --init --recursive
          echo "=== frida-core / frida-gum 版本 ==="
          git submodule status | head -20

      - name: Apply anti-detection patches
        run: |
          python3 tools/port_patches_to_1522.py frida
          echo "=== 复查：参与 Android 构建的文件里不应再出现下列特征 ==="
          cd frida/subprojects/frida-core
          for k in "frida:rpc" "re.frida.server" "frida_agent_main" "gum-js-loop"; do
            hits=$(grep -rl "$k" src/linux lib server 2>/dev/null | wc -l || true)
            echo "$k -> $hits 个文件"
          done
          cd ../frida-gum
          echo "gum-js-loop -> $(grep -rl 'gum-js-loop' bindings gum 2>/dev/null | wc -l || true) 个文件"

      - name: Build frida-server for android-arm64
        run: |
          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          mkdir -p build
          cd build
          ../frida/configure --host=android-arm64
          make

      - name: Collect artifact
        run: |
          mkdir -p out
          target="out/frida-server-15.2.2-ggbond-android-arm64"
          for f in \
            build/subprojects/frida-core/server/frida-server \
            build/frida-android-arm64/bin/frida-server
          do
            if [ -f "$f" ]; then cp "$f" "$target"; break; fi
          done
          if [ ! -f "$target" ]; then
            find build -type f -name 'frida-server' -print | head -5
            find build -type f -name 'frida-server' -print -quit | while read -r f; do cp "$f" "$target"; done
          fi
          chmod +x "$target" 2>/dev/null || true
          ls -l out
          file "$target" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-15.2.2-ggbond-android-arm64
          path: out/frida-server-15.2.2-ggbond-android-arm64
          if-no-files-found: error
