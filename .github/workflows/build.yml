# 路线 A 配套 workflow —— 放进 <你的 Florida fork>/.github/workflows/florida-arm64.yml
#
# 与上游 build.yml 的三处关键不同：
#   1) 只用 workflow_dispatch（无 schedule / 无 push），不会自己跑、不吃配额
#   2) 只编译 android-arm64（原版编四个架构，6 小时上限里很容易超时）
#   3) 上传用 actions/upload-artifact@v4，
#      不用上游那个 actions/upload-release-asset@v1.0.2（Node 12 运行时，已被 GitHub 停用归档，
#      这正是上游从某个版本起 release 有名字却 assets=0 的直接原因）

name: Build Florida server (arm64)

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "frida tag to build, e.g. 17.23.3. leave empty for latest release"
        required: false
        default: ""
      ndk_version:
        description: "Android NDK version"
        required: false
        default: "r29"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Disk space before
        run: df -h

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ github.event.inputs.ndk_version }}
          local-cache: false
          link-to-sdk: true

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: install dependencies
        run: |
          sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev \
            flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev \
            python3-pip libc6-dev libc6-dev-i386
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief graphlib

      - name: Resolve frida version
        id: ver
        run: |
          V="${{ github.event.inputs.frida_version }}"
          if [ -z "$V" ]; then
            V=$(curl -s https://api.github.com/repos/frida/frida/releases/latest \
                | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          fi
          if [ -z "$V" ]; then echo "无法解析版本号"; exit 1; fi
          echo "frida=$V" >> $GITHUB_OUTPUT
          echo "将编译 frida $V"

      - name: build frida for Android (arm64 only)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -e
          git config --global user.name  "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "NDK clang: $(ls $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android*-clang 2>/dev/null | head -1)"

          git clone --recurse-submodules https://github.com/frida/frida
          cd frida
          git checkout "${{ steps.ver.outputs.frida }}"
          git submodule update --init --recursive

          for path in ../patches/*; do
            name=$(basename "$path")
            if [ ! -d "subprojects/$name" ]; then
              echo "跳过 $name（不是 frida 的 subproject）"
              continue
            fi
            echo "=== 应用 patches/$name 到 subprojects/$name ==="
            ( cd "subprojects/$name" && git am --3way "../../../patches/$name"/*.patch )
          done
          cd ..

          ARCH=android-arm64
          df -h
          mkdir "build-$ARCH"
          cd "build-$ARCH"
          ../frida/configure --host=$ARCH
          make

      - name: package
        run: |
          B=build-android-arm64/subprojects/frida-core
          ls -la "$B/server/frida-server"
          gzip -kf "$B/server/frida-server"
          mkdir -p out
          mv "$B/server/frida-server.gz" "out/florida-server-${{ steps.ver.outputs.frida }}-android-arm64.gz"
          if [ -f "$B/inject/frida-inject" ]; then
            cp "$B/inject/frida-inject" "out/frida-inject-${{ steps.ver.outputs.frida }}-android-arm64"
          fi
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-${{ steps.ver.outputs.frida }}-android-arm64
          path: out/*
          retention-days: 30

      # 想直接发到 release 就解开下面这段的注释（配合 Settings -> Actions -> Read and write）
      # - name: Create release and upload
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: ${{ steps.ver.outputs.frida }}
      #     name: ${{ steps.ver.outputs.frida }}
      #     files: out/*
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
